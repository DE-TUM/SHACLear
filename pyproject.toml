[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shacl-nl-interface"
version = "0.1.0"
description = "Translate SHACL constraint shapes into natural-language explanations using LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Simon Jost" }]
license = { text = "MIT" }

dependencies = [
    # Core
    "pyshacl~=0.25.0",
    "rdflib~=7.1.0",
    "httpx~=0.27.0",
    "python-dotenv~=1.0.0",

    # Backend (FastAPI)
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "python-multipart~=0.0.12",
]

[project.optional-dependencies]
# pip install -e ".[dev]"  →  testing + linting
dev = [
    "pytest~=8.0",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["core*", "backend*"]
exclude = ["frontend*", "tests*", "node_modules*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
